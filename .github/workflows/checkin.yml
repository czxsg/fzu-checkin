name: checkin

on:
  schedule:
    # 目标：21:00 一开窗就签，且高频重试，尽量早完成（迟到线 22:30 前）
    # GitHub cron 最小粒度是 5 分钟，故 21:00-22:20 每 5 分钟一档，共 17 次；
    # 前两档 20:35 / 20:55 是对冲 GitHub 定时延迟 1-4 小时的（准点到达在窗口外会被静默跳过，
    #   被延迟拖进 21:00 后则正好签到）；
    # 22:30 迟到线之后只留 3 档保底（宁迟到不缺席）；
    # 已签到后的补跑会静默跳过（不推送、不重复签）。（北京时间为准）
    # cron 为 UTC 时间，北京时间 = UTC + 8
    - cron: "35 12 * * *"    # 20:35 对冲延迟
    - cron: "55 12 * * *"    # 20:55 对冲延迟
    - cron: "0 13 * * *"     # 21:00 首签（main.py 会等到 21:02 避开开窗边界）
    - cron: "5 13 * * *"     # 21:05
    - cron: "10 13 * * *"    # 21:10
    - cron: "15 13 * * *"    # 21:15
    - cron: "20 13 * * *"    # 21:20
    - cron: "25 13 * * *"    # 21:25
    - cron: "30 13 * * *"    # 21:30
    - cron: "35 13 * * *"    # 21:35
    - cron: "40 13 * * *"    # 21:40
    - cron: "45 13 * * *"    # 21:45
    - cron: "50 13 * * *"    # 21:50
    - cron: "55 13 * * *"    # 21:55
    - cron: "0 14 * * *"     # 22:00
    - cron: "5 14 * * *"     # 22:05
    - cron: "10 14 * * *"    # 22:10
    - cron: "15 14 * * *"    # 22:15
    - cron: "20 14 * * *"    # 22:20 迟到线前最后一档
    - cron: "45 14 * * *"    # 22:45 保底
    - cron: "15 15 * * *"    # 23:15 保底
    - cron: "45 15 * * *"    # 23:45 末班
  workflow_dispatch: {}   # 支持手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # 认证配置两种来源，优先级：CONFIG_YAML secret > 仓库内已提交的 config.yaml（私密库场景）
      # secret 内容 = 完整的 config.yaml，两种认证方式任选：
      #   1) user.token: "<免登token>"           （token 方式）
      #   2) user.username / user.password       （学号密码自动登录，token 留空）
      - name: Prepare config (secret overrides committed config)
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then
            echo "$CONFIG_YAML" > config.yaml
            echo "config from CONFIG_YAML secret"
          else
            test -s config.yaml && echo "config from committed config.yaml"
          fi

      - name: Run checkin
        run: python main.py
